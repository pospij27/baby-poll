<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Baby Pool results 👶</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #eeede9;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --pink-bg: #FBEAF0; --pink-border: #D4537E; --pink-text: #72243E;
    --blue-bg: #E6F1FB; --blue-border: #378ADD; --blue-text: #0C447C;
    --bar: #5E8E24; --grid: #ebeae6; --due-band: #efeee9;
    --red: #A32D2D;
    --radius: 12px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efe9; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --pink-bg: #3a1a24; --pink-border: #D4537E; --pink-text: #f4c0d1;
      --blue-bg: #0e2236; --blue-border: #378ADD; --blue-text: #B5D4F4;
      --bar: #6FA33A; --grid: #2c2c29; --due-band: #262624;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .lang-bar { display: flex; gap: 6px; justify-content: flex-end; padding: 0.75rem 1rem 0; max-width: 580px; margin: 0 auto; }
  .lang-btn { padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); font-weight: 500; }
  .lang-btn:hover { background: var(--bg2); }
  .lang-btn.active-lang { background: var(--bg2); color: var(--text); border-color: var(--border2); }
  main { padding: 1.5rem 1rem 3rem; max-width: 580px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 0.25rem; }
  h3 { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 0.5rem; }
  p { font-size: 14px; color: var(--text2); line-height: 1.6; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card-sub { font-size: 13px; color: var(--text2); margin: -0.25rem 0 0.75rem; }
  .hero { text-align: center; padding: 1rem 0 1.25rem; }
  .hero-emoji { font-size: 36px; margin-bottom: 8px; }
  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
  .metric { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 1rem; }
  .metric .val { font-size: 22px; font-weight: 500; color: var(--text); }
  .metric .lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stat-label { font-size: 13px; color: var(--text2); min-width: 90px; }
  .bar-wrap { flex: 1; height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .bar-girl { background: var(--pink-border); }
  .bar-boy { background: var(--blue-border); }
  .stat-num { font-size: 13px; font-weight: 500; color: var(--text); min-width: 28px; text-align: right; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; overflow: visible; }
  .chart-wrap text { font-family: inherit; }
  .chart-wrap .hit { fill: transparent; cursor: default; outline: none; }
  .chart-wrap .col.hover .bar { opacity: 0.75; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); opacity: 0; transition: opacity 0.1s; z-index: 5; }
  .chart-tip.show { opacity: 1; }
  .chart-tip strong { font-weight: 600; }
  .outside-note { font-size: 12px; color: var(--text2); margin-top: 0.75rem; }
  details { margin-top: 0.75rem; font-size: 13px; color: var(--text2); }
  summary { cursor: pointer; font-size: 12px; }
  table { border-collapse: collapse; margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 16px 3px 0; font-size: 13px; border-bottom: 0.5px solid var(--border); }
  th { font-weight: 500; color: var(--text); }
  .entry-row { border-top: 0.5px solid var(--border); padding: 0.6rem 0; font-size: 13px; color: var(--text2); display: flex; justify-content: space-between; align-items: center; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 1.25rem; }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); }
  .tab.active-tab { background: var(--bg2); color: var(--text); font-weight: 500; }
  .empty { font-size: 13px; color: var(--text2); }
  .error { font-size: 13px; color: var(--red); text-align: center; padding: 1rem 0; }
</style>
</head>
<body>

<main>

      <div class="tab active-tab" id="tab-girl" onclick="switchNamesTab('girl')"></div>
      <div class="tab" id="tab-boy" onclick="switchNamesTab('boy')"></div>

    <div id="names-stats"></div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://hknkoiiescuhzdsktwok.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrbmtvaWllc2N1aHpkc2t0d29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxOTg3NTUsImV4cCI6MjA5NDc3NDc1NX0.fd-l_ayYxrmCG6nAtQziu3vfI2XavBtOO5n_y28yTok";
const TABLE = "entries";
const DUE_DAY = 17;   // due date: 17 October
const MONTH = 10;     // October
const DAYS_IN_MONTH = 31;

let lang = 'en';
let currentNamesTab = 'girl';
let entries = null;
let loadFailed = false;

// Picks the plural form for Czech/Ukrainian style languages: one / few (2–4) / many.
function slavicPlural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function czechPlural(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }

const i18n = {
  en: {
    locale: 'en-GB', docTitle: 'Baby Pool results 👶',
    title: "Baby Pool results", subtitle: "Thanks to everyone who played! Here's how everyone guessed.",
    totalGuesses: "Total guesses", girl: "👧 Girl", boy: "👦 Boy",
    genderPred: "Gender predictions",
    dateTitle: "Birth date guesses", dateSub: "Number of guesses for each day of October",
    dueDate: "Due date", outsideOct: "Guessed outside October:",
    tableToggle: "Show as table", dayCol: "Day", guessesCol: "Guesses",
    namesTitle: "Suggested names", tabGirl: "👧 Girls", tabBoy: "👦 Boys",
    noNames: "No names suggested.", noDateGuesses: "No date guesses.",
    loading: "Loading…", loadError: "Couldn't load the results. Please try again later.",
    guesses: c => `${c} guess${c === 1 ? '' : 'es'}`,
    votes: c => `${c} vote${c === 1 ? '' : 's'}`,
  },
  cs: {

    title: "Výsledky tipovačky", subtitle: "Díky všem, kdo tipovali! Takhle jste hlasovali.",
    totalGuesses: "Celkem tipů", girl: "👧 Holčička", boy: "👦 Klouček",
    genderPred: "Předpovědi pohlaví",
    dateTitle: "Tipy na datum narození", dateSub: "Počet tipů pro každý den v říjnu",
    dueDate: "Termín", outsideOct: "Tipy mimo říjen:",
    tableToggle: "Zobrazit jako tabulku", dayCol: "Den", guessesCol: "Tipy",
    namesTitle: "Navržená jména", tabGirl: "👧 Holčičky", tabBoy: "👦 Kluci",
    noNames: "Žádná navržená jména.", noDateGuesses: "Žádné tipy na datum.",
    loading: "Načítám…", loadError: "Výsledky se nepodařilo načíst. Zkus to prosím později.",
    guesses: c => `${c} ${czechPlural(c, 'tip', 'tipy', 'tipů')}`,
    votes: c => `${c} ${czechPlural(c, 'hlas', 'hlasy', 'hlasů')}`,
  },
  uk: {
    locale: 'uk-UA', docTitle: 'Результати опитування 👶',
    title: "Результати опитування", subtitle: "Дякуємо всім, хто брав участь! Ось як ви голосували.",
    totalGuesses: "Всього прогнозів", girl: "👧 Дівчинка", boy: "👦 Хлопчик",
    genderPred: "Прогнози статі",
    dateTitle: "Прогнози дати народження", dateSub: "Кількість прогнозів на кожен день жовтня",
    dueDate: "Очікувана дата", outsideOct: "Прогнози поза жовтнем:",
    tableToggle: "Показати таблицею", dayCol: "День", guessesCol: "Прогнози",
    namesTitle: "Запропоновані імена", tabGirl: "👧 Дівчатка", tabBoy: "👦 Хлопчики",
    noNames: "Імен не запропоновано.", noDateGuesses: "Прогнозів дати немає.",
    loading: "Завантаження…", loadError: "Не вдалося завантажити результати. Спробуй пізніше.",
    guesses: c => `${c} ${slavicPlural(c, 'прогноз', 'прогнози', 'прогнозів')}`,
    votes: c => `${c} ${slavicPlural(c, 'голос', 'голоси', 'голосів')}`,
  },
  no: {
    locale: 'nb-NO', docTitle: 'Resultater 👶',
    title: "Resultater", subtitle: "Takk til alle som var med! Slik gjettet dere.",
    totalGuesses: "Totalt antall gjetninger", girl: "👧 Jente", boy: "👦 Gutt",
    genderPred: "Kjønnsprediksjoner",
    dateTitle: "Gjetninger på fødselsdato", dateSub: "Antall gjetninger for hver dag i oktober",
    dueDate: "Termin", outsideOct: "Gjettet utenfor oktober:",
    tableToggle: "Vis som tabell", dayCol: "Dag", guessesCol: "Gjetninger",
    namesTitle: "Foreslåtte navn", tabGirl: "👧 Jenter", tabBoy: "👦 Gutter",
    noNames: "Ingen navn foreslått.", noDateGuesses: "Ingen datogjetninger.",
    loading: "Laster…", loadError: "Kunne ikke laste resultatene. Prøv igjen senere.",
    guesses: c => `${c} gjetning${c === 1 ? '' : 'er'}`,
    votes: c => `${c} stemme${c === 1 ? '' : 'r'}`,
  }
};

function t(key) { return i18n[lang][key] ?? i18n.en[key] ?? key; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function formatDayMonth(year, month, day) {
  return new Intl.DateTimeFormat(t('locale'), { day: 'numeric', month: 'long' })
    .format(new Date(year, month - 1, day));
}

function applyTranslations() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  [
    ['t-title','title'], ['t-subtitle','subtitle'], ['t-gender-pred','genderPred'],
    ['t-date-title','dateTitle'], ['t-date-sub','dateSub'], ['t-table-toggle','tableToggle'],
    ['t-names-title','namesTitle'], ['tab-girl','tabGirl'], ['tab-boy','tabBoy'],
  ].forEach(([id, key]) => { document.getElementById(id).textContent = t(key); });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active-lang', b.dataset.lang === lang));
}

function setLang(l) {
  lang = l;
  applyTranslations();
  render();
}

async function loadEntries() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?order=created_at.asc&select=gender,date,girl_names,boy_names`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function render() {
  const metrics = document.getElementById('metrics');
  if (loadFailed) {
    metrics.innerHTML = `<p class="error" style="grid-column:1/-1;">${escapeHtml(t('loadError'))}</p>`;
    return;
  }
  if (!entries) {
    metrics.innerHTML = `<div class="metric"><div class="val">…</div><div class="lbl">${t('loading')}</div></div>`;
    return;
  }
  renderGender();
  renderDateChart();
  renderNamesTab();
}

function renderGender() {
  const total = entries.length;
  const girls = entries.filter(e => e.gender === 'girl').length;
  const boys = total - girls;
  const girlPct = total ? Math.round(girls / total * 100) : 0;
  const boyPct = total ? 100 - girlPct : 0;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="val">${total}</div><div class="lbl">${t('totalGuesses')}</div></div>
    <div class="metric"><div class="val">${girlPct}%</div><div class="lbl">${t('girl')}</div></div>
    <div class="metric"><div class="val">${boyPct}%</div><div class="lbl">${t('boy')}</div></div>
  `;
  document.getElementById('gender-bars').innerHTML = `
    <div class="stat-row"><span class="stat-label">${t('girl')}</span><div class="bar-wrap"><div class="bar-fill bar-girl" style="width:${girlPct}%"></div></div><span class="stat-num">${girls}</span></div>
    <div class="stat-row"><span class="stat-label">${t('boy')}</span><div class="bar-wrap"><div class="bar-fill bar-boy" style="width:${boyPct}%"></div></div><span class="stat-num">${boys}</span></div>
  `;
}

// Counts guesses per October day; anything outside October is collected separately.
function countDates() {
  const perDay = new Array(DAYS_IN_MONTH + 1).fill(0);
  const outside = {};
  let year = new Date().getFullYear();
  entries.forEach(e => {
    if (!e.date) return;
    const [y, m, d] = e.date.split('-').map(Number);
    if (m === MONTH) { perDay[d]++; year = y; }
    else outside[e.date] = (outside[e.date] || 0) + 1;
  });
  return { perDay, outside, year };
}

function niceStep(max) {
  if (max <= 5) return 1;
  const raw = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / pow;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
}

// Column path with a 4px rounded top and a square base.
function columnPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function renderDateChart() {
  const wrap = document.getElementById('date-chart');
  const tip = document.getElementById('chart-tip');
  const { perDay, outside, year } = countDates();
  const max = Math.max(...perDay);

  const W = Math.max(wrap.clientWidth, 260), H = 220;
  const m = { top: 20, right: 4, bottom: 40, left: 26 };
  const plotW = W - m.left - m.right, plotH = H - m.top - m.bottom;
  const slot = plotW / DAYS_IN_MONTH;
  const barW = Math.min(24, Math.max(slot - 2, 2));
  const step = niceStep(Math.max(max, 1));
  const yTop = Math.max(Math.ceil(max / step) * step, step);
  const y = v => m.top + plotH - (v / yTop) * plotH;
  const cx = day => m.left + slot * (day - 0.5);

  const showLabel = slot >= 16 ? () => true
    : slot >= 9 ? d => d % 2 === 1
    : d => [1, 10, DUE_DAY, 24, 31].includes(d);

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${escapeHtml(t('dateTitle'))}">`;
  // due date band
  svg += `<rect x="${cx(DUE_DAY) - slot / 2}" y="${m.top}" width="${slot}" height="${plotH}" fill="var(--due-band)"/>`;
  // gridlines + y ticks
  for (let v = 0; v <= yTop; v += step) {
    svg += `<line x1="${m.left}" x2="${W - m.right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    svg += `<text x="${m.left - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text3)" style="font-variant-numeric:tabular-nums">${v}</text>`;
  }
  // columns
  for (let d = 1; d <= DAYS_IN_MONTH; d++) {
    const c = perDay[d];
    svg += `<g class="col" data-day="${d}">`;
    if (c > 0) {
      svg += `<path class="bar" d="${columnPath(cx(d) - barW / 2, y(c), barW, y(0) - y(c))}" fill="var(--bar)"/>`;
      if (c === max) svg += `<text x="${cx(d)}" y="${y(c) - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">${c}</text>`;
    }
    svg += `<rect class="hit" x="${cx(d) - slot / 2}" y="${m.top}" width="${slot}" height="${plotH + 18}" tabindex="0" aria-label="${escapeHtml(formatDayMonth(year, MONTH, d) + ': ' + t('guesses')(c))}"/>`;
    svg += `</g>`;
    if (showLabel(d) || d === DUE_DAY) {
      const due = d === DUE_DAY;
      svg += `<text x="${cx(d)}" y="${m.top + plotH + 15}" text-anchor="middle" font-size="11" fill="${due ? 'var(--text)' : 'var(--text3)'}" font-weight="${due ? 600 : 400}">${d}</text>`;
    }
  }
  svg += `<text x="${cx(DUE_DAY)}" y="${m.top + plotH + 32}" text-anchor="middle" font-size="11" fill="var(--text2)">▲ ${escapeHtml(t('dueDate'))}</text>`;
  svg += `</svg>`;

  wrap.querySelector('svg')?.remove();
  wrap.insertAdjacentHTML('beforeend', svg);

  const showTip = g => {
    const d = Number(g.dataset.day);
    wrap.querySelectorAll('.col.hover').forEach(el => el.classList.remove('hover'));
    g.classList.add('hover');
    tip.innerHTML = `<strong>${escapeHtml(formatDayMonth(year, MONTH, d))}</strong> · ${escapeHtml(t('guesses')(perDay[d]))}`;
    const top = (perDay[d] > 0 ? y(perDay[d]) : y(0)) - (perDay[d] === max ? 16 : 0);
    const left = Math.min(Math.max(cx(d) / W * wrap.clientWidth, 70), wrap.clientWidth - 70);
    tip.style.left = `${left}px`;
    tip.style.top = `${top / H * wrap.clientHeight}px`;
    tip.classList.add('show');
  };
  const hideTip = () => {
    tip.classList.remove('show');
    wrap.querySelectorAll('.col.hover').forEach(el => el.classList.remove('hover'));
  };
  wrap.querySelectorAll('.col').forEach(g => {
    g.addEventListener('pointerenter', () => showTip(g));
    g.addEventListener('focusin', () => showTip(g));
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('focusout', hideTip);
  });

  // guesses outside October
  const outsideList = Object.entries(outside).sort((a, b) => a[0].localeCompare(b[0]));
  document.getElementById('outside-note').innerHTML = outsideList.length
    ? `${escapeHtml(t('outsideOct'))} ${outsideList.map(([date, c]) => {
        const [yy, mm, dd] = date.split('-').map(Number);
        return `${escapeHtml(formatDayMonth(yy, mm, dd))} (${c})`;
      }).join(', ')}`
    : '';

  // table view
  const rows = [];
  for (let d = 1; d <= DAYS_IN_MONTH; d++) if (perDay[d]) rows.push(`<tr><td>${escapeHtml(formatDayMonth(year, MONTH, d))}</td><td>${perDay[d]}</td></tr>`);
  outsideList.forEach(([date, c]) => {
    const [yy, mm, dd] = date.split('-').map(Number);
    rows.push(`<tr><td>${escapeHtml(formatDayMonth(yy, mm, dd))}</td><td>${c}</td></tr>`);
  });
  document.getElementById('date-table').innerHTML = rows.length
    ? `<table><thead><tr><th>${escapeHtml(t('dayCol'))}</th><th>${escapeHtml(t('guessesCol'))}</th></tr></thead><tbody>${rows.join('')}</tbody></table>`
    : `<p class="empty" style="margin-top:0.5rem;">${escapeHtml(t('noDateGuesses'))}</p>`;
}

function switchNamesTab(tab) {
  currentNamesTab = tab;
  document.getElementById('tab-girl').className = 'tab' + (tab === 'girl' ? ' active-tab' : '');
  document.getElementById('tab-boy').className = 'tab' + (tab === 'boy' ? ' active-tab' : '');
  renderNamesTab();
}

function renderNamesTab() {
  if (!entries) return;
  const nameCounts = {};
  entries.forEach(e => {
    const raw = currentNamesTab === 'girl' ? e.girl_names : e.boy_names;
    if (raw) raw.split(',').forEach(n => { n = n.trim(); if (n) nameCounts[n] = (nameCounts[n] || 0) + 1; });
  });
  const sorted = Object.entries(nameCounts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  document.getElementById('names-stats').innerHTML = sorted.length
    ? sorted.map(([n, c]) => `<div class="entry-row"><span>${escapeHtml(n)}</span><span style="font-weight:500;color:var(--text);">${escapeHtml(t('votes')(c))}</span></div>`).join('')
    : `<p class="empty">${escapeHtml(t('noNames'))}</p>`;
}

let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (entries) renderDateChart(); }, 100);
}).observe(document.getElementById('date-chart'));

applyTranslations();
render();
loadEntries()
  .then(data => { entries = data; render(); })
  .catch(() => { loadFailed = true; render(); });
</script>
</body>
</html>
